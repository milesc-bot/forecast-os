name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # PyPI trusted publishing (OIDC)

jobs:
  # Publication is irreversible — a PyPI version number can never be reused — so
  # the full test matrix runs BEFORE the build, not alongside it. v0.10.0 was
  # published by this workflow and only then failed CI on the oldest supported
  # pandas, which required a same-day 0.10.1 to correct.
  ci:
    uses: ./.github/workflows/ci.yml
    # Read-only: the tests need no write access, and this workflow holds
    # contents:write and id-token:write for the publish step below.
    permissions:
      contents: read

  build-and-publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
      - name: Publish to PyPI (trusted publishing)
        # Publishes forecast-os-gtm via a configured PyPI Trusted Publisher
        # (repo milesc-bot/forecast-os, workflow release.yml, environment pypi).
        uses: pypa/gh-action-pypi-publish@release/v1
