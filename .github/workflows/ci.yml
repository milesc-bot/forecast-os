name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so the release workflow can gate publication on this exact matrix.
  # A PyPI version can never be reused, so publishing must not start until the
  # full matrix — including the oldest supported pandas — has gone green.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pin oldest supported pandas line (3.10 job)
        if: matrix.python-version == '3.10'
        run: pip install "pandas>=2,<3"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  core-install:
    # Proves the minimal install works with only numpy/pandas/scipy — no
    # extras, no optional backends. Guards the advertised public surface
    # against accidentally growing a heavy hard dependency.
    name: Core-only install (numpy/pandas/scipy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with no extras
        run: pip install .
      - name: Forecast round-trip on a clean install
        run: |
          python -c "import forecast_os as f; f.ForecastEngine(models=['auto_ets']).forecast(f.generate_series(n_series=2, length=40), h=3)"
      - name: CLI model catalog
        run: forecast-os models
